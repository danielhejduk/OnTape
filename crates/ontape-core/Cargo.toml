[package]
name = "ontape-core"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
name = "ontape_core"
crate-type = ["lib", "cdylib"]

[dependencies]
rusqlite = { version = "0.43.0", features = ["bundled"] }
rodio = { version = "0.23", default-features = false, features = ["playback"] }
symphonia = { version = "0.6.1", features = ["all"] }
symphonia-adapter-libopus = "0.3"
