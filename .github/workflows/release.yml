name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_PROFILE_RELEASE_STRIP: "true"

jobs:
  build:
    name: Build ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Dynamically linked against glibc and libasound; sqlite and opus
          # are bundled. Needs glibc >= 2.39 and libasound2 on the host.
          - name: cli-x86_64-linux-gnu
            os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            package: ontape-cli
            deps: libasound2-dev cmake pkg-config
          - name: cli-aarch64-linux-gnu
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            package: ontape-cli
            deps: libasound2-dev cmake pkg-config
          # GTK4 can't be linked statically; this build needs GTK >= 4.14 and
          # libadwaita >= 1.5 on the host system.
          - name: gtk-x86_64-linux-gnu
            os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            package: ontape-gtk
            deps: libasound2-dev libgtk-4-dev libadwaita-1-dev cmake pkg-config
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ${{ matrix.deps }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}-${{ matrix.package }}

      - name: Build
        run: cargo build --release --locked -p ${{ matrix.package }} --target ${{ matrix.target }}

      - name: Package
        run: |
          dir="${{ matrix.package }}-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir "$dir"
          cp "target/${{ matrix.target }}/release/${{ matrix.package }}" README.md "$dir/"
          tar -czf "$dir.tar.gz" "$dir"
          echo "ASSET=$dir.tar.gz" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ env.ASSET }}
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt

      - name: Create release and upload binaries
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            flags=(--title "$TAG" --generate-notes --verify-tag)
            [[ "$TAG" == *-* ]] && flags+=(--prerelease)
            gh release create "$TAG" "${flags[@]}"
          fi
          gh release upload "$TAG" dist/* --clobber
