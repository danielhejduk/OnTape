name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_PROFILE_RELEASE_STRIP: "true"

jobs:
  build:
    name: Build ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Fully static CLI (musl, static libasound/libopus/sqlite).
          - name: cli-x86_64-linux
            os: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            package: ontape-cli
            static: true
          - name: cli-aarch64-linux
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            package: ontape-cli
            static: true
          # GTK4 can't be linked statically; this build needs GTK >= 4.14 and
          # libadwaita >= 1.5 on the host system.
          - name: gtk-x86_64-linux-gnu
            os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            package: ontape-gtk
            static: false
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install musl toolchain and static ALSA
        if: matrix.static
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends musl-tools cmake pkg-config
          .github/scripts/build-static-alsa.sh "$RUNNER_TEMP/alsa-static"
          target_env="$(echo '${{ matrix.target }}' | tr '[:lower:]-' '[:upper:]_')"
          target_lc="$(echo '${{ matrix.target }}' | tr '-' '_')"
          {
            echo "PKG_CONFIG_ALLOW_CROSS=1"
            echo "PKG_CONFIG_ALL_STATIC=1"
            echo "PKG_CONFIG_PATH=$RUNNER_TEMP/alsa-static/lib/pkgconfig"
            echo "PKG_CONFIG_LIBDIR=$RUNNER_TEMP/alsa-static/lib/pkgconfig"
            echo "CC_${target_lc}=musl-gcc"
            echo "CARGO_TARGET_${target_env}_LINKER=musl-gcc"
          } >> "$GITHUB_ENV"
      - name: Install GTK dependencies
        if: matrix.package == 'ontape-gtk'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev libgtk-4-dev libadwaita-1-dev cmake pkg-config

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}-${{ matrix.package }}

      - name: Build
        run: cargo build --release --locked -p ${{ matrix.package }} --target ${{ matrix.target }}

      - name: Verify the binary is static
        if: matrix.static
        run: |
          bin="target/${{ matrix.target }}/release/${{ matrix.package }}"
          file "$bin"
          file "$bin" | grep -Eq 'static(-pie|ally) linked'

      - name: Package
        run: |
          dir="${{ matrix.package }}-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir "$dir"
          cp "target/${{ matrix.target }}/release/${{ matrix.package }}" README.md "$dir/"
          tar -czf "$dir.tar.gz" "$dir"
          echo "ASSET=$dir.tar.gz" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ env.ASSET }}
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt

      - name: Create release and upload binaries
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            flags=(--title "$TAG" --generate-notes --verify-tag)
            [[ "$TAG" == *-* ]] && flags+=(--prerelease)
            gh release create "$TAG" "${flags[@]}"
          fi
          gh release upload "$TAG" dist/* --clobber
