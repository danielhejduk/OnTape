[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
rust-version = "1.99"
license = "GPL-3.0-or-later"

[package]
name = "ontape"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[profile.dev.package."*"]
opt-level = 2

[dependencies]
ontape-core = { path = "crates/ontape-core" }
symphonia = "0.6.1"
